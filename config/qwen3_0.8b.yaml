# Qwen 3.5 0.8B — unified run config (Phase 1, 2, 2b)
# Use --model to switch base vs instruct checkpoint.
# CLI flags override these values when explicitly passed.

model: Qwen/Qwen3.5-0.8B-Base
family: qwen
out_dir: outputs
dtype: null

hyperparameters:
  entropy_top_pct: 0.01
  entropy_top_n: 10
  nullspace_top_pct: 0.01
  nullspace_k: 10
  dataset: stas/c4-en-10k
  data_end: 400
  max_seq_length: 256
  seed: 42
  k: 4
  batch_size: 1
  n_random: 90
  n_random_pct: null
  chunk_size: 5
  filter_start_pos: 3
  filter_end_pos: -1
  n_trace_neurons: 6
  box_plot_n_random: 10
  use_log2_entropy: false

# Ext 2 — inter-layer MLP→MLP null-space weight projection (static)
# SwiGLU reader = stacked [gate|up]. Inherits nullspace knobs from hyperparameters.
ext2:
  seed: 42
  device: cuda
  n_trace_neurons: 6
  n_align_random: 15
