# Llama 3.2 1B (base) — unified run config (Phase 1, 2, 3)
# CLI flags override these values when explicitly passed.

model: meta-llama/Llama-3.2-1B
family: llama
out_dir: outputs
dtype: null

# Phase 1 & 2 — neuron identification and C4 ablation
hyperparameters:
  entropy_top_pct: 0.01
  entropy_top_n: 12
  nullspace_top_pct: 0.01
  nullspace_k: 20
  dataset: stas/c4-en-10k
  data_end: 400
  max_seq_length: 256
  seed: 42
  k: 4
  batch_size: 1
  n_random: 90
  n_random_pct: null
  chunk_size: 20
  filter_start_pos: 3
  filter_end_pos: -1
  n_trace_neurons: 6
  box_plot_n_random: 10
  write_align_n_random: 90
  write_align_mode: both
  use_log2_entropy: false

# Ext 1 — QA ablation (LAMA T-REx + TriviaQA)
exp1:
  use_chat_template: false
  data_dir: data/exp1
  seed: 42
  sample_sizes:
    sanity: 20
    main: 500
  calibration:
    dataset: stas/c4-en-10k
    data_end: 200
    max_seq_length: 256
  ablation:
    include_random_control: true
    sanity_modes:
      - mean_all_entropy
      - per_neuron_avg
    main_modes:
      - mean_all_entropy
    branches:
      - te
      - de_ln
    chunk_size: 20
  datasets:
    lama:
      hf_path: facebook/lama
      config: trex
      filter_single_token_gold: true
      max_new_tokens: 32
    triviaqa:
      hf_path: mandarjoshi/trivia_qa
      config: rc.nocontext
      split: validation
      max_new_tokens: 64
      prompt_template: "Question: {question}\nAnswer:"
  decoding:
    modes:
      - greedy
      - sampling
    greedy:
      do_sample: false
    sampling:
      do_sample: true
      temperature: 1.0
      top_p: 1.0
  runtime:
    device: cuda
    dtype: null

# Ext 2 — inter-layer MLP→MLP null-space weight projection (static)
# SwiGLU reader = stacked [gate|up]. Inherits nullspace knobs from hyperparameters.
exp2:
  seed: 42
  device: cuda
  n_trace_neurons: 6
  n_align_random: 15

# Ext 3 — hallucination probe: last-MLP activations → correct/wrong classifier
exp3:
  use_chat_template: false
  seed: 42
  device: cuda
  data_dir: data/exp3
  sample_sizes:
    sanity: 50
    main: 3000
  split_ratios:
    train: 0.70
    val: 0.15
    test: 0.15
  checkpoint_every: 50
  label_default: top1
  confident_error_top1_prob: 0.5
  lama:
    hf_path: facebook/lama
    config: trex
    filter_single_token_gold: true
  logistic:
    n_iter: 40
    cv: 3
    max_iter: 2000
  mlp:
    n_iter: 20
    max_epochs: 80
    batch_size: 64
    patience: 10
  importance:
    n_repeats: 3
    top_k: 40
