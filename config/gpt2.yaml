# GPT-2 — unified run config (Exp 1 phases + Exp 2/3)
# CLI flags override these values when explicitly passed.

model: gpt2-small
family: gpt2
out_dir: outputs
dtype: null

# Exp 1 — neuron identification and C4 ablation
# Paper (gpt2-small): udark_start=-12 (bottom 12 W_U singular vectors, d_model=768);
# effective nullspace_k = min(round(nullspace_top_pct * d_model), nullspace_k) → 12.
hyperparameters:
  entropy_top_pct: 0.01
  entropy_top_n: 12
  nullspace_top_pct: 0.016
  nullspace_k: 12
  dataset: stas/c4-en-10k
  data_end: 400
  max_seq_length: 256
  seed: 42
  k: 6
  batch_size: 1
  n_random: 90
  n_random_pct: null
  chunk_size: 20
  filter_start_pos: 3
  filter_end_pos: -1
  n_trace_neurons: 6
  box_plot_n_random: 10
  write_align_n_random: 90
  write_align_mode: both
  use_log2_entropy: false

# Exp 2 — every MLP W_out vs later MLP W_in null spaces and vs W_U (static)
# Inherits nullspace_top_pct / nullspace_k from hyperparameters when omitted.
exp2:
  seed: 42
  device: cuda
  # nullspace_top_pct: 0.016
  # nullspace_k: 12
  n_trace_neurons: 6
  n_align_random: 15

# Exp 3 — hallucination probe: last-MLP activations → correct/wrong classifier
exp3:
  dataset: qa_wikidata
  use_chat_template: false
  seed: 42
  device: cuda
  data_dir: data/exp3
  sample_sizes:
    sanity: 200
    main: 10000
  split_ratios:
    train: 0.70
    val: 0.15
    test: 0.15
  checkpoint_every: 250
  label_default: top1
  confident_error_top1_prob: 0.5
  bigbench:
    hf_path: tasksource/bigbench
    config: qa_wikidata
    filter_single_token_gold: true
  logistic:
    n_iter: 40
    cv: 3
    max_iter: 2000
  mlp:
    n_iter: 20
    max_epochs: 80
    batch_size: 64
    patience: 10
  importance:
    n_repeats: 3
    top_k: 40
